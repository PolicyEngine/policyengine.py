# Workflow that fails a pull request whose head holds agent or job notes.
#
# Subfleet build jobs keep their state in .job/ at the root of their
# worktree, and #704 and #699 committed .job/HANDOFF.md and .job/PR_BODY.md
# on 23 October 2026. .github/check-agent-notes.sh lists the paths it
# rejects.
#
# pr_code_changes.yaml has a path filter, so a pull request that adds only
# such files runs none of its jobs. This workflow has no path or branch
# filter. It checks the pull request's head commit, fetched as data, not the
# merge with the base, so retargeting a stacked pull request cannot change
# the result. Main has none of these paths, so a pull request based on main
# fails exactly when it adds one.
#
# A "[skip ci]" in a pull request's head commit skips pull_request runs, and
# a direct push can reach main without one. So it also checks main on every
# push and every day: a schedule is never skipped. It uses pull_request, not
# pull_request_target, like the other pull request workflows here
# (docs/release-bundles.md): GitHub blocks pull_request_target in public
# repositories without an event policy from 2 December 2026.

name: Agent notes
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  AgentNotes:
    name: No agent or job notes in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fetch the pull request's head commit
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - name: No agent or job notes in the tree
        # An explicit bash shell adds pipefail, so a git failure fails the
        # step instead of passing it. The script sets it too.
        shell: bash
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/check-agent-notes.sh "$COMMIT"
