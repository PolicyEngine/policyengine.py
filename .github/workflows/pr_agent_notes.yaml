# Workflow that fails a pull request whose head holds agent or job notes.
#
# Subfleet build jobs keep their state in .job/ at the root of their
# worktree, and #704 and #699 committed .job/HANDOFF.md and .job/PR_BODY.md
# on 23 October 2026. .github/check-agent-notes.sh lists the paths it
# rejects.
#
# It runs on pull_request_target, not pull_request, so that:
# - a "[skip ci]" in the head commit cannot skip it (skip instructions apply
#   to push and pull_request only);
# - it runs on a pull request with a merge conflict, which pull_request skips;
# - it runs main's guard, so a pull request cannot turn it off by editing
#   this file or the script. A change to either takes effect when it merges;
#   tests/test_check_agent_notes.py tests it before then.
# It checks the head commit's whole tree, not the merge with the base, so
# retargeting a stacked pull request cannot change the result. Main has
# none of these paths, so a pull request based on main fails exactly when
# it adds one. pull_request_target has no path filter here and runs for
# every base branch.
#
# pull_request_target runs with this repository's token, so the job must
# never run code from the pull request: it checks out main, fetches the head
# commit as data, and reads its tree into a temporary index. The token can
# only read, and no secret is used.

name: Agent notes
on:
  pull_request_target:
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run. Manual dispatches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  AgentNotes:
    name: No agent or job notes in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Main (the commit that triggered a manual run), never the pull
      # request's code.
      - uses: actions/checkout@v6
      - name: Fetch the pull request's head commit as data
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - name: No agent or job notes in the tree
        # An explicit bash shell adds pipefail, so a git failure fails the
        # step instead of passing it. The script sets it too.
        shell: bash
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/check-agent-notes.sh "$COMMIT"
