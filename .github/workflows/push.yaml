# Unified workflow for pushes to main.
#
# Phase 1 (normal push): Lint + Test → Docs + Versioning
#   Versioning commits with message "Update package version".
#   The commit pushes to main, re-triggering this workflow for Phase 2.
#
# Phase 2 (sentinel commit): Publish to PyPI + GitHub Release
#   Skips Lint + Test since the code is identical to Phase 1.
#   After Publish, NotifyConsumers waits for the release to be visible on
#   PyPI and sends a policyengine-release repository dispatch to consumer
#   repos so they open version-bump PRs.

name: Push to main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Phase 1 gates (skip on sentinel commit) ─────────────────
  Lint:
    if: github.event.head_commit.message != 'Update package version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff format check
        run: ruff format --check .
      - name: Run ruff check
        run: ruff check .

  Test:
    if: github.event.head_commit.message != 'Update package version'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install package
        run: uv pip install -e .[dev] --system
      - name: Install policyengine
        run: uv pip install policyengine --system
      - name: Run tests with coverage
        run: make test
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}

  # ── Phase 1: Docs + Versioning (skip on sentinel commit) ──
  Docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    needs: [Lint, Test]
    if: github.event.head_commit.message != 'Update package version'
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Build HTML Assets
        run: make docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  Versioning:
    runs-on: ubuntu-24.04
    needs: [Lint, Test]
    if: github.event.head_commit.message != 'Update package version'
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      POLICYENGINE_SKIP_COUNTRY_IMPORTS: '1'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --tags --force
      - uses: ./.github/actions/release-toolchain
      - name: Authenticate candidate and reproduce its exact prepared tree
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: python scripts/release_build.py versioning --output "$RUNNER_TEMP/wrapper-versioning-receipt.json"
      - name: Preserve authenticated Versioning preparation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrapper-versioning-check-${{ github.sha }}
          path: ${{ runner.temp }}/wrapper-versioning-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Preview changelog update
        run: .github/get-changelog-diff.sh
      - name: Update changelog, bundle metadata, and TROs
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          add: '-u .'
          message: Update package version

  # ── Phase 2: Publish (only on sentinel commit) ────────────
  Publish:
    runs-on: ubuntu-24.04
    if: github.event.head_commit.message == 'Update package version'
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      POLICYENGINE_SKIP_COUNTRY_IMPORTS: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-toolchain
      - name: Authenticate candidate, validate release and compare rebuilt wheel
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: python scripts/release_build.py publish-check --output "$RUNNER_TEMP/wrapper-publish-receipt.json"
      - name: Preserve prepublication byte comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrapper-publish-byte-check-${{ github.sha }}
          path: ${{ runner.temp }}/wrapper-publish-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Capture published version
        id: version
        run: bash .github/capture-version.sh
      - name: Export bundle release assets
        run: python scripts/export_bundle_release_assets.py --dist-dir release-assets
      - name: Verify bundle package metadata
        run: |
          VERSION=$(python .github/fetch_version.py)
          policyengine bundle verify --country us --country uk --packages-only --json \
            > "release-assets/policyengine-bundle-$VERSION.verification.json"
      - name: Publish a git tag
        run: |
          python scripts/release_build.py require-unpublished
          .github/publish-git-tag.sh
      - name: Recheck registry immediately before distribution upload
        run: python scripts/release_build.py require-unpublished
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI }}
          skip-existing: false
          packages-dir: dist
      - name: Create GitHub Release
        run: |
          VERSION=$(python .github/fetch_version.py)
          gh release create "$VERSION" \
            --title "v$VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/PolicyEngine/policyengine.py/blob/main/CHANGELOG.md) for details." \
            --latest \
            "release-assets/policyengine-bundle-$VERSION.json" \
            "release-assets/policyengine-bundle-$VERSION.constraints.txt" \
            "release-assets/policyengine-bundle-$VERSION.citation.txt" \
            "release-assets/policyengine-bundle-$VERSION.verification.json"

  # ── Phase 2: Open consumer update PRs (after Publish) ─────
  NotifyConsumers:
    name: Open consumer update PRs
    runs-on: ubuntu-latest
    needs: [Publish]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Wait for release to be visible on PyPI
        env:
          VERSION: ${{ needs.Publish.outputs.version }}
        run: bash .github/wait-for-pypi.sh
      - name: Validate published SPM bundle before consumer updates
        run: python -S scripts/bundle.py check --published-spm
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: PolicyEngine
          repositories: policyengine-api,policyengine-sim-api
      - name: Dispatch policyengine-release to consumer repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.Publish.outputs.version }}
        run: bash .github/dispatch-policyengine-release.sh
