name: Frozen release build scaffold
description: Install the identical hash-locked candidate and publishing toolchain
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14.7'
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: '0.12.13'
    - name: Install hash-locked preparation and build tools
      shell: bash
      run: python scripts/release_build.py bootstrap --output "$RUNNER_TEMP/wrapper-release-tools"
